# Move to .github/workflows/check.yml to enable. See README.md.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sync:
    name: shared/ is in sync, and the catalog is true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync.mjs --check
      - run: node scripts/catalog.mjs --check
      - run: node scripts/app-config.mjs --check
      - run: node scripts/release-age.mjs --check
      - run: node scripts/studio-ui.mjs --check

  # A fresh `pnpm install` of every template, as a person who just created a
  # project runs it: an empty store, no --frozen-lockfile, and every pnpm they
  # are likely to have. See scripts/install-check.mjs.
  install:
    name: pnpm ${{ matrix.pnpm }} installs every template
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pnpm: ["10", "11", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/install-check.mjs
        env:
          PNPM_VERSIONS: ${{ matrix.pnpm }}

  tanstack-full:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tanstack/full
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tanstack/full/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm exec prettier --check .
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm exec val validate
      - run: pnpm run build-storybook

